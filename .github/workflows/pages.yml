name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # A phone that cached an older stylesheet would pair it with newer HTML and render a broken
      # page, so every deploy gives the CSS, JS and images a new URL.
      - name: Stamp asset URLs with the commit
        run: sed -i "s/__V__/${GITHUB_SHA::8}/g" site/*.html site/tr/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
